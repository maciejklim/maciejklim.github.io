name: Deploy to Github Pages

on:
    push:
        branches: [master]
    # Pull requests only build the site as a check; they never deploy.
    pull_request:
        branches: [master]

concurrency:
    group: pages-${{ github.ref }}
    # Superseded PR builds are cancelled; deploys from master always finish.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v6
              with:
                  path: resources
                  key: hugo-resources-${{ hashFiles('assets/**', 'content/**') }}
                  restore-keys: hugo-resources-

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Build
              run: hugo --minify --gc --cleanDestinationDir

            - name: Deploy 🚀
              if: github.event_name == 'push'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
